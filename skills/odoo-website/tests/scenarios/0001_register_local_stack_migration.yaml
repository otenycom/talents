# Live-site prior-shape: hosted row + shipped ensure_cmd, no services.d/,
# no migrations.json. Checklist — not migrate: <id> sql.
bot: odoo-website
live_only: true

seed:
  profile:
    site_name: "Lab Vanity"
    site_purpose: "prior-shape live site"
    site_slug: "lab-vanity"
    owner_email: "lab@example.com"
    language: "en"
    odoo_locus: "local"
    build_backend: "module"

turns:
  - user: "the site is already up — just make sure it comes back after a restart"
    expect:
      tool_calls:
        - tool: list_services
        - tool: register_service
      reply:
        contains_any: ["register", "service", "postgres", "odoo"]
  - user: "did that keep-alive land?"
    expect:
      reply:
        contains_any: ["already", "registered", "services", "none pending"]
