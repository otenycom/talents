# Scenario: FULL VM WebsiteBot arc — Moon Skydive Club (funny flagship).
# Fresh Max/VM: intake → INSTALL → MODULE build (site_module.py) → host 8069 → status.
#
# LIVE-ONLY + VM-ONLY: `requires: {substrate: vm}` SKIPS on mock + container clones.
# Lab gate: test_vm_website_e2e_live.py + HH_VM_WEBSITE_SCENARIO=1 (pins this file).
#
# Telegram note: expect.reply needles drive collect-until — long turns wait for the
# READY / host phrases, not the opening "Setting up…" ack (see hermeshost
# collect_telegram_reply). Avoid bare substrings like "name" (matches "memory").
bot: odoo-website
live_only: true
requires:
  substrate: vm

turns:
  # 1) First contact — intake only (incl. locus/backend when asked).
  - user: >
      I want a funny website for a Moon Skydive Club. Do NOT build or publish anything yet.
      Do NOT use oteny-drop, drop.oteny.bot, http.server, or any static HTML.
      Follow first-run.md Step 1 only: ask me for the site name, web address slug, admin email,
      and language — then wait for my answers.
    reply_timeout: 360
    expect:
      reply:
        contains_any:
          - "site name"
          - "web address"
          - "admin email"
          - "subdomain"
          - "email address"
          - "what should we call"
          - "what should we call it"
          - "call the site"
          - "slug"
          - "language"
        not_contains:
          - "used up your Oteny balance"
          - "oteny_topup"
          - "drop.oteny.bot"
          - "http.server"
          - "is live"
      trace:
        loads_skill: odoo-website

  # 2) Answers + local module backend + install → exact READY phrase + site_module init.
  - user: >
      Call it Moon Skydive Club — jump from Starship, land on the Moon, bring snacks.
      Web address: moondive. Admin email: pilot@example.com. Language: English.
      Host Odoo on this Max bot (local). Use the default custom MODULE build backend
      (build_backend: module, odoo_locus: local) — not JSON-2, not http.server.
      Follow first-run.md: write the profile (include odoo_locus/build_backend), run
      install_odoo.sh, setup_admin.py, preflight until READY: yes, then
      site_module.py init --slug moondive. When done, say exactly:
      Your website engine is ready — what should the site say?
    reply_timeout: 2400
    expect:
      reply:
        contains_any:
          - "website engine is ready"
          - "your website engine is ready"
        not_contains:
          - "http.server"
          - "drop.oteny.bot"
          - "/oteny_subscribe upgrade max"

  # 3) Homepage via site_module.py (not site_rpc).
  - user: >
      Set the homepage with site_module.py set-homepage (not site_rpc). Title:
      Moon Skydive Club. Body HTML: <p>Jump from Starship. Land on the Moon. Bring snacks.</p>
      On success say: Homepage updated — Moon Skydive Club.
    reply_timeout: 900
    expect:
      reply:
        contains_any:
          - "Homepage updated"
          - "Moon Skydive Club"
          - "SITE_MODULE_OK"
        not_contains:
          - "drop.oteny.bot"
          - "http.server"
          - "Homepage set failed"
          - "SITE_MODULE_ERR"
          - "homepage_id"

  # 4) Publish ask.
  - user: "put it online"
    reply_timeout: 300
    expect:
      reply:
        contains_any:
          - "public"
          - "confirm"
          - "go ahead"
          - "shall I"
          - "publish"
          - "oteny.bot"
          - "moondive"
          - "hosting"
          - "Live"
          - "active"
        not_contains: ["8080", "http.server", "drop.oteny.bot"]

  # 5) Go-ahead → host 8069.
  - user: "yes, go ahead — host the Odoo site on port 8069"
    reply_timeout: 600
    expect:
      reply:
        contains_any: ["oteny.bot", "moondive", "8069", "provisioning", "hosting", "Already done", "active"]
        not_contains: ["8080", "http.server", "drop.oteny.bot"]

  # 6) Status.
  - user: "is it up?"
    reply_timeout: 300
    expect:
      tool_calls:
        - tool: list_hosted_websites
      reply:
        contains_any: ["oteny.bot", "moondive", "active", "up", "live"]
