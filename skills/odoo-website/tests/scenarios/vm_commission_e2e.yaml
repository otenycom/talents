# Scenario: FULL VM WebsiteBot arc — Moon Skydive Club (funny flagship).
# Fresh Max/VM box (no ~/odoo-site yet): intake → INSTALL → BUILD via site_rpc.py
# (JSON-2) → confirm-before-publish → host_website(8069) → list_hosted_websites.
#
# LIVE-ONLY + VM-ONLY: `requires: {substrate: vm}` SKIPS on mock + container clones.
# Lab gate: test_vm_website_e2e_live.py + HH_VM_WEBSITE_SCENARIO=1 (pins this file).
bot: odoo-website
live_only: true
requires:
  substrate: vm

turns:
  # 1) First contact — bot must intake (name / address / email), NOT install yet.
  - user: "build me a funny website for a Moon Skydive Club"
    reply_timeout: 180
    expect:
      reply:
        contains_any: ["name", "address", "email", "slug", "subdomain"]
      trace:
        loads_skill: odoo-website

  # 2) Answer intake → install (~3–5 min on Max) + setup_admin. Generous timeout.
  - user: >
      Call it Moon Skydive Club — jump from Starship, land on the Moon, bring snacks.
      Web address: moondive. Admin email: pilot@example.com. Language: English.
    reply_timeout: 2400
    expect:
      reply:
        contains_any: ["ready", "Moon", "moondive", "minutes", "set up", "installed", "engine"]

  # 3) Build homepage via locked JSON-2 path (site_rpc.py), not the browser builder.
  - user: >
      Set the homepage title to Moon Skydive Club and the body to:
      Jump from Starship. Land on the Moon. Bring snacks.
    reply_timeout: 900
    expect:
      reply:
        contains_any: ["Moon", "Skydive", "homepage", "page", "done", "updated"]

  # 4) Publish — site is PUBLIC; bot must CONFIRM before hosting.
  - user: "put it online"
    reply_timeout: 120
    expect:
      reply:
        contains_any: ["public", "confirm", "go ahead", "shall I", "oteny.bot"]

  # 5) Go-ahead → host_website(8069); report public URL.
  - user: "yes, go ahead"
    reply_timeout: 300
    expect:
      tool_calls:
        - tool: host_website
      reply:
        contains: ["oteny.bot"]

  # 6) Status check.
  - user: "is it up?"
    reply_timeout: 120
    expect:
      tool_calls:
        - tool: list_hosted_websites
      reply:
        contains_any: ["oteny.bot", "moondive", "active", "up", "live"]
