# Scenario: FULL VM WebsiteBot arc — Moon Skydive Club (funny flagship).
# Fresh Max/VM box (no ~/odoo-site yet): intake → INSTALL → BUILD via site_rpc.py
# (JSON-2) → confirm-before-publish → host_website(8069) → list_hosted_websites.
#
# LIVE-ONLY + VM-ONLY: `requires: {substrate: vm}` SKIPS on mock + container clones.
# Lab gate: test_vm_website_e2e_live.py + HH_VM_WEBSITE_SCENARIO=1 (pins this file).
#
# Telegram note: expect.reply needles drive collect-until — long turns wait for the
# READY / host phrases, not the opening "Setting up…" ack (see hermeshost
# collect_telegram_reply). Avoid bare substrings like "name" (matches "memory").
bot: odoo-website
live_only: true
requires:
  substrate: vm

turns:
  # 1) First contact — bot must intake (site name / web address / admin email), NOT build/host.
  #    Live turns often take ~3–4 min (skill load + first model round); 180s timed out on
  #    hh00383 while the gateway was still generating the 858-char intake reply.
  #    hh00384 freelanced a drop.oteny.bot fake on a vague "build me…" — be explicit.
  - user: >
      I want a funny website for a Moon Skydive Club. Do NOT build or publish anything yet.
      Do NOT use oteny-drop, drop.oteny.bot, http.server, or any static HTML.
      Follow first-run.md Step 1 only: ask me for the site name, web address slug, admin email,
      and language — then wait for my answers.
    reply_timeout: 360
    expect:
      reply:
        contains_any:
          - "site name"
          - "web address"
          - "admin email"
          - "subdomain"
          - "email address"
          - "what should we call"
          - "what should we call it"
          - "call the site"
          - "slug"
          - "language"
        not_contains:
          - "used up your Oteny balance"
          - "oteny_topup"
          - "drop.oteny.bot"
          - "http.server"
          - "is live"
      trace:
        loads_skill: odoo-website

  # 2) Answer intake → install_odoo.sh + setup_admin (~3–5 min). Wait for the exact
  #    first-run READY phrase — NOT a vague "engine is ready" (that matched a static
  #    http.server fake on hh00379).
  - user: >
      Call it Moon Skydive Club — jump from Starship, land on the Moon, bring snacks.
      Web address: moondive. Admin email: pilot@example.com. Language: English.
      Please follow first-run.md exactly: write the profile, run install_odoo.sh
      (not http.server), then setup_admin.py, then preflight until READY: yes.
      When done, say exactly: Your website engine is ready — what should the site say?
    reply_timeout: 2400
    expect:
      reply:
        contains_any:
          - "website engine is ready"
          - "your website engine is ready"
        not_contains:
          - "http.server"
          - "drop.oteny.bot"

  # 3) Build homepage via locked JSON-2 path (site_rpc.py), not the browser builder /
  #    not a static http.server fake.
  - user: >
      Set the homepage title to Moon Skydive Club and the body to:
      Jump from Starship. Land on the Moon. Bring snacks.
    reply_timeout: 900
    expect:
      reply:
        contains_any: ["Moon Skydive", "homepage", "updated", "set the homepage", "done"]

  # 4) Publish ask — confirm OR host immediately (hh00383 hosted on this turn; both OK
  #    as long as the reply is about publishing the real Odoo site, not a static fake).
  - user: "put it online"
    reply_timeout: 300
    expect:
      reply:
        contains_any:
          - "public"
          - "confirm"
          - "go ahead"
          - "shall I"
          - "publish"
          - "oteny.bot"
          - "moondive"
          - "hosting"
          - "Live"
          - "active"
        not_contains: ["8080", "http.server", "drop.oteny.bot"]

  # 5) Go-ahead → host_website(8069) only — never port 8080 / http.server.
  #    Idempotent: if turn 4 already hosted, "Already done" + URL is a pass.
  - user: "yes, go ahead — host the Odoo site on port 8069"
    reply_timeout: 600
    expect:
      reply:
        contains_any: ["oteny.bot", "moondive", "8069", "provisioning", "hosting", "Already done", "active"]
        not_contains: ["8080", "http.server", "drop.oteny.bot"]

  # 6) Status check — after the gate's background drain, the public URL should be live.
  - user: "is it up?"
    reply_timeout: 300
    expect:
      tool_calls:
        - tool: list_hosted_websites
      reply:
        contains_any: ["oteny.bot", "moondive", "active", "up", "live"]
