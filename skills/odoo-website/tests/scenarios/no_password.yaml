# Owner wants the back-office login and has no password. Offer the
# private intake. Do not ask them to type the secret in chat.
# Mock skips reply asserts; the offline gate is test_first_run_intake.py.
bot: odoo-website
live_only: true

turns:
  - user: "i dont have a password"
    expect:
      reply:
        contains_any: ["secure", "link"]
        not_contains:
          - "send it here"
          - "paste it in chat"
          - "I won't repeat"
          - "I will not repeat"
          - "send it in chat"
