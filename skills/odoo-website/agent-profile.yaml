# odoo-website — the sellable "WebsiteBot" Talent. A Talent = persona + skills, one
# of several loadable on a tenant's OtenyBot. This one installs a real website engine (Odoo
# Community) INSIDE the tenant's box, lets the owner build a site by chatting, and puts it
# online at <slug>.oteny.bot via the built-in host_website tool — no server to rent, no ports
# to open. Composition is config, not SOUL surgery: drop the skill files + merge routing.
bot: odoo-website
display_name: WebsiteBot
tagline: "Build a real website by chatting — a landing page, a shop, a booking site — and put it online at your own address."
# The landing-page "what it does" body (oteny.com/bots/odoo-website) — plain paragraphs,
# escaped, split on blank lines. House voice: lead with the value, plain English, honest.
long_md: |
  Talk to WebsiteBot in chat — you never run tools or code. Say what you want online ("a
  one-page site for my cafe with a menu and opening hours", "a small shop for my pottery",
  "a booking page for my studio") and it builds it, then puts it on the internet. No hosting
  to buy. You describe; it builds and publishes.

  On Max it installs Odoo Community inside your private box and (by default) keeps the site in
  a small Odoo module the bot can recover and debug — including custom style and code when you
  need it. Prefer Odoo Online instead? It can drive that too over a secure API — but a custom
  module is not possible on Online. Not on Max yet? Send /oteny_subscribe upgrade max in
  Telegram, then come back.

  When it's ready, say "put my site online" — it confirms, then gives you
  https://yourname.oteny.bot over secure HTTPS (an outbound tunnel, nothing exposed to the
  open internet). Want your own domain? Type: Attach my domain example.com to site yourname
  (include www). Change the copy, ask "is my site up?", or "take the site down" — plain
  sentences are enough.

  It's your own web team in a chat: it keeps the site running, restarts it if it hiccups, and
  tells you the public link every time.
version: 1.0.16  # Talent semver — a label over the delivered commit; bump on every change,
                 # MINOR/MAJOR when migrations.yaml gains an id (lint-enforced).
                 # 1.0.16: whole Talent uses type-this chat story (owner phrases → bot notes).
                 # 1.0.15: custom domain = type-this chat story (not attach_site_domains API).
                 # 1.0.14: export post_init_hook from __init__.py (Odoo package lookup).
                 # 1.0.13: Odoo 19 homepage_url (not homepage_id); page at /oteny-home.
                 # 1.0.12: site_module upgrade must leave Odoo serving on 8069 (hh00386 502).
                 # 1.0.11: dual backend — module default (Max/local) vs JSON-2 Online;
                 # non-Max module asks → /oteny_subscribe upgrade max; bot-owned git.
                 # 1.0.10: first reply = intake questions only (never drop.oteny.bot / static).
                 # 1.0.9: Moon scenario timeouts + publish expects match live host path.
                 # 1.0.8: Moon E2E requires exact "website engine is ready"; host on 8069 only.
                 # 1.0.7: assert_reply honors contains_any; Moon host turns tolerate
                 # provisioning while the gate drains CF tunnels.
                 # 1.0.6: drop oteny-drop from related_skills; ban drop.oteny.bot as a site
                 # substitute (slug_taken → other slug, never drop).
                 # 1.0.5: never reuse an existing *.oteny.bot/drop link while READY:no.
                 # 1.0.4: Moon Skydive multi-turn E2E scenario; ban static http.server while
                 # READY:no; tighter intake/READY expect needles for Telegram collect-until.
                 # 1.0.3: site_rpc.py on Odoo External JSON-2 (/json/2/ + bearer api_key);
                 # setup_admin mints the key; XML-RPC retired for the locked build path.
                 # 1.0.2: honest ~3–5 min install copy; setup_admin + site_rpc locked path;
                 # owner /web/login handoff (password never in chat).
                 # 1.0.0: first release — Odoo CE user-space + host_website.

# The skills delivered together.
skills:
  - odoo-website
voice_skill: odoo-website

base_language: en
model_tier: builder                      # installs software + reasons about hosting/debugging → the builder tier
# Hardware requirement (a capability, NOT a raw customer tier — substrate is internal).
# `substrate: vm` = a full kernel + dedicated machine (not a packed gVisor container): real
# systemd supervises the app, Odoo's one-time init is minutes (no gofer tax), and the box has
# its own egress IP. `min_tier` is the cheapest subscription that provides it today
# (max → VM); the storefront renders "Requires the Max plan" and gates purchase, the deployer
# warns on a mismatch, and install_odoo.sh/preflight refuse at runtime as a backstop. The lint
# enforces substrate↔min_tier consistency.
requires:
  substrate: vm
  min_tier: max
toolset_contribution: [terminal, execute_code, cron, send_message]   # unioned into the agent
# Brokered tools this Talent needs. host_website / unhost_website / list_hosted_websites are
# platform defaults (the hh-sites gateway plugin, delivered to every box) — declared here so
# the store copy + the lint know the Talent depends on them (they are LIVE, never stubbed).
tools:
  required: [host_website, unhost_website, list_hosted_websites]
delivery: purchased                      # à-la-carte from the Bot Market (not baked into every box)
price: free                              # free during the pilot (Q4: flip to paid at go-live)
# Verify budget: the whole scenario-suite staging run must stay under this measured spend or
# the dev-loop verify holds the Talent for review. OTC = internal credits; tune from runs.
expected_cost_otc: 6.0

# Routing declaration — APPLIED by the index-reconciler, never hand-edited into SOUL. DM-first
# (the native skill index routes DMs to the loaded skill); a group binding is optional.
routing:
  channel: "OtenyWebsiteTalent"
  channel_prompt: |
    You are the owner's OtenyBot, acting as their **WebsiteBot** — you build a real website
    (Odoo Community on Max locally, or JSON-2 against Odoo Online/remote) and host local sites
    at <slug>.oteny.bot. Refer to yourself by your own bot name; the Talent is a capability,
    not your identity. Owners type plain chat sentences; they never call tools by name — you
    do. Load odoo-website (skill_view name='odoo-website') and follow its "What the owner
    types" map + first-run.md / build-and-host.md / custom-domain.md. On FIRST message (no
    profile yet) or "build me a website" / "what can you do?": FIRST reply = intake only
    (site name, slug, admin email, language, local vs Online/remote, module vs JSON-2) —
    do not build/publish/host/HTML/browser/drop. Default local Max → build_backend=module.
    Odoo Online/remote → custom module impossible (JSON-2 only). Wants module but not Max →
    tell them exactly: /oteny_subscribe upgrade max. "Put my site online" → confirm then
    host_website port 8069. Custom domain → custom-domain.md (e.g. Attach my domain
    example.com to site <slug> (include www).). Forbidden: oteny-drop, drop.oteny.bot,
    python -m http.server, static HTML fakes, reusing *.oteny.bot while READY:no. Never
    odoo-shell password resets. Confirm before first publish / take-down. Reply in the
    owner's language; Telegram-compact.
  signature: "odoo-website"

# Shared identity + this bot's domain memory.
seed_memory: profile/USER.md.template          # -> ~/.hermes/memories/USER.md (identity)
seed_domain_memory: profile/memory.md.template # -> ~/.hermes/data/odoo-website/memory.md
