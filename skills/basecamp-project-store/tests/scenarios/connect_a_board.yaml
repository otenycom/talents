# Scenario: an owner points the bot at a board for the first time.
#
# The bot must load this skill from the plain sentence, recognise it is not connected, and run
# the connect drill — INCLUDING saying out loud that signing in reaches the whole Basecamp
# account, not just this project. That warning is the honest half of the feature; a bot that
# quietly takes account-wide access is the failure this scenario exists to catch.
#
# LIVE-ONLY: this Talent's state is files, not a database, so the offline backend has nothing
# to ground an assertion in — the natural-language routing is proven here.
bot: basecamp-project-store
live_only: true

turns:
  - user: "the materials for this job are in Basecamp, account 12345, project 67890"
    expect:
      reply:
        # explains the sign-in, and warns that access is account-wide rather than per-project
        contains_any: ["account", "whole", "sign in", "link"]
      trace:
        # the bundle name reaches the log through the preflight call that opens every turn
        markers: ["basecamp-project-store"]