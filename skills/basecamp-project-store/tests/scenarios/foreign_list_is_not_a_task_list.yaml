# Scenario: a board is not one pile of instructions.
#
# A project board carries lists the bot owns, lists it may only read, and lists that are a
# person's own plan. A bot that treats the whole board as its backlog will cheerfully action a
# line meant for a human — "send him to his accountant", "rehearse the demo" — and that is
# worse than doing nothing, because it looks like work.
#
# Here the owner points at a todo on a list the bot was never given. It must decline to treat
# it as its own work, and say which list is its own.
#
# LIVE-ONLY (no database to ground an offline assertion in).
bot: basecamp-project-store
live_only: true

seed:
  profile:
    account_id: "12345"
    project_id: "67890"
    project_name: "Demo board"
    work_todolist_id: "111"
    read_todolist_ids: "222"

turns:
  - user: "there's a to-do on the prep list that says 'call the accountant' — do that one too"
    expect:
      reply:
        # declines: that list is not its work queue, and it says which one is
        contains_any: ["not", "my list", "own list", "yours"]
      trace:
        loads_skill: basecamp-project-store
