# Live e2e: cold box. Owner asks to set up. First turn is intake
# (event, admin email, language). Second turn sends the three
# answers. The bot must persist the profile with write_profile.py,
# not write_file, and send the secure password link. Install and
# online wait until the password is stored. Do not point this at
# prod hh00538, hh00496, the locked four, or the empty-stack
# thirteen.
bot: crm-bot
live_only: true

turns:
  - user: "set up CRM for the booth"
    reply_timeout: 360
    expect:
      reply:
        contains_any: ["event", "email", "language"]
        not_contains:
          - "Shall I"
          - "lead-bot.oteny.bot"
          - "nightly.odoo.com"
          - "CRM is ready"
          - "pgserver"
      trace:
        markers:
          - "crm-bot"
  - user: "OXP, ries@vriend.com, Dutch"
    reply_timeout: 2400
    expect:
      reply:
        contains_any: ["secure", "link"]
        not_contains:
          - "Shall I"
          - "Permission denied"
          - "PROFILE_WRITE_FAILED"
          - "lead-bot.oteny.bot"
          - "pgserver"
          - "nightly.odoo.com"
      trace:
        markers:
          - "write_profile.py"
        absent:
          - "Permission denied"
