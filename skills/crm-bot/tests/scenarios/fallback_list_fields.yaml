# odoo-community's local-odoo-client.md and list_fields.py, never a lead
# script bent to a job it does not do. Live-only: reply routing is not
# judged on mock.
bot: crm-bot

turns:
  - user: "Show me the fields on res.users."
    expect:
      reply:
