# Owner has CRM up and no login password. The reply must offer the
# private intake and must not ask them to type the secret in chat.
# Mock skips reply asserts; the offline gate is test_first_run_intake.py.
bot: crm-bot
live_only: true

turns:
  - user: "i dont have a password"
    expect:
      reply:
        contains_any: ["secure", "link"]
        not_contains:
          - "send it here"
          - "paste it in chat"
          - "I won't repeat"
          - "I will not repeat"
          - "send it in chat"
