bot: odoo-community
base_language: en

artifacts:
  - kind: routing
    config_path: ~/.hermes/config.yaml
    platform: telegram
    signature: "odoo-community"

  - kind: tools
    present_if_file:
      ensure_odoo: ~/.hermes/skills/talents/odoo-community/scripts/ensure_odoo.sh
      install_odoo: ~/.hermes/skills/talents/odoo-community/scripts/install_odoo.sh
      wait_for_public_dns: ~/.hermes/skills/talents/odoo-community/scripts/wait_for_public_dns.py
      pin_crm_home: ~/.hermes/skills/talents/odoo-community/scripts/pin_crm_home.py
    stubbed: []

  - kind: tools
    present_if_file:
      local_odoo_rpc: ~/.hermes/skills/talents/odoo-community/scripts/local_odoo_rpc.py
      local_odoo_paths: ~/.hermes/skills/talents/odoo-community/scripts/local_odoo_paths.py
      crud: ~/.hermes/skills/talents/odoo-community/scripts/crud.py
      rpc: ~/.hermes/skills/talents/odoo-community/scripts/rpc.py
      sql: ~/.hermes/skills/talents/odoo-community/scripts/sql.py
      list_models: ~/.hermes/skills/talents/odoo-community/scripts/list_models.py
      list_fields: ~/.hermes/skills/talents/odoo-community/scripts/list_fields.py
      list_views: ~/.hermes/skills/talents/odoo-community/scripts/list_views.py
    stubbed: []

  - kind: tools
    blocking: false
    present_if_file:
      odoo_tree: ~/odoo-site/odoo/odoo
    stubbed: []
