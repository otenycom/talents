bot: odoo-community
base_language: en

artifacts:
  - kind: routing
    config_path: ~/.hermes/config.yaml
    platform: telegram
    signature: "odoo-community"

  - kind: tools
    present_if_file:
      ensure_odoo: ~/.hermes/skills/talents/odoo-community/scripts/ensure_odoo.sh
      install_odoo: ~/.hermes/skills/talents/odoo-community/scripts/install_odoo.sh
      wait_for_public_dns: ~/.hermes/skills/talents/odoo-community/scripts/wait_for_public_dns.py
      pin_crm_home: ~/.hermes/skills/talents/odoo-community/scripts/pin_crm_home.py
    stubbed: []

  - kind: tools
    blocking: false
    present_if_file:
      odoo_tree: ~/odoo-site/odoo/odoo
    stubbed: []
