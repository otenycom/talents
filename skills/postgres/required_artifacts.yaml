# Inert installer: files on disk are enough. A missing cluster is not
# NOT-READY — the owner never asked, so first-run must not start.
bot: postgres
base_language: en

artifacts:
  - kind: routing
    config_path: ~/.hermes/config.yaml
    platform: telegram
    signature: "postgres"

  - kind: tools
    present_if_file:
      ensure_postgres: ~/.hermes/skills/talents/postgres/scripts/ensure_postgres.sh
      install_postgres: ~/.hermes/skills/talents/postgres/scripts/install_postgres.sh
    stubbed: []

  - kind: tools
    # Built when the owner asks. Never a delivery gate.
    blocking: false
    present_if_file:
      postgres_prefix: ~/postgres/bin/pg_ctl
    stubbed: []
