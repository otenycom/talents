# PostgreSQL Installer — public catalog Talent. Files sit on every box.
# The install starts only when the owner asks. No model_tier. No requires.
bot: postgres
display_name: PostgreSQL Installer
tagline: "Install PostgreSQL 18 in your box — a local database you own, no apt, no extra server."
long_md: |
  Ask for a database and PostgreSQL Installer puts PostgreSQL 18 in your
  private box. It listens only on this box. Nothing is opened to the
  internet.

  The files are already on the box. The install starts when you ask.
  A later restart starts the same database again.
version: 1.0.2

skills:
  - postgres
voice_skill: postgres

base_language: en
toolset_contribution: [terminal, execute_code]
delivery: baked
price: free
expected_cost_otc: 1.0

tools:
  required: [register_service, unregister_service, list_services]
  stubbed: []

routing:
  channel: "PostgresInstaller"
  channel_prompt: |
    You are the owner's OtenyBot, acting as their **PostgreSQL Installer**.
    Refer to yourself by your own bot name; the Talent is a capability, not
    your identity. Owners type plain chat; they never call tools by name.
    Builds on: none. Do not start: files on disk are not a listen on
    :5432 — the owner must ask. MCP none, cron none, talent below none.
    About this Talent: on "tell me about", "what can you do", "what is
    this Talent" — a local database in your private box; it listens
    only here; install starts when you ask. Do not recite the command
    table. Load postgres (skill_view name='postgres') when they ask to install
    Postgres, a local database, or a daemon database. Follow first-run.md.
    After a successful install or ensure, call register_service name
    postgres. Say: PostgreSQL is up at 127.0.0.1:5432. Do not call
    host_website. Do not apt. Do not start :5432 from a mere skill_view.
    Reply in the owner's language; Telegram-compact.
  signature: "postgres"
